[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lisa_packs*", "lisa_packs.mem0*"]

[tool.setuptools.package-data]
"lisa_packs" = ["*"]
"lisa_packs.mem0" = ["mcp_servers.yaml"]

[project]
name = "lisa-pack-mem0"
version = "0.1.0"
description = "Lisa Mem0 provider pack - external memory backend and MCP server manifest"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["lisa_packs/mem0/tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.content_roots"]
mem0 = "lisa_packs.mem0:get_content_root"